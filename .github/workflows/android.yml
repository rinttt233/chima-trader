name: android-apk

# Builds the standalone Android APK in the cloud: the repo has no local Android
# SDK/NDK/Gradle, so CI downloads the NDK + nodejs-mobile prebuilt libnode.so,
# bundles the Node server into the APK assets and signs the release APK with the
# keystore kept in repository secrets (stable certificate => in-place upgrades).

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'tools/android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

env:
  APP_VERSION: '1.4.0'
  NODE_MOBILE_VERSION: '18.20.4'
  NDK_VERSION: '26.1.10909125'
  CMAKE_VERSION: '3.22.1'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Android NDK and CMake
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" || true
          test -d "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" || { echo "::error::NDK ${NDK_VERSION} is not installed"; exit 1; }
          test -d "$ANDROID_SDK_ROOT/cmake/${CMAKE_VERSION}" || { echo "::error::CMake ${CMAKE_VERSION} is not installed"; exit 1; }
          echo "NDK: $ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"
          echo "CMake: $ANDROID_SDK_ROOT/cmake/${CMAKE_VERSION}"

      - name: Download nodejs-mobile runtime
        run: |
          set -euo pipefail
          curl -L --retry 3 --fail -o /tmp/nodejs-mobile.zip \
            "https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v${NODE_MOBILE_VERSION}/nodejs-mobile-v${NODE_MOBILE_VERSION}-android.zip"
          rm -rf /tmp/nodejs-mobile && mkdir -p /tmp/nodejs-mobile
          unzip -q /tmp/nodejs-mobile.zip -d /tmp/nodejs-mobile
          echo "--- archive top level ---"
          ls -la /tmp/nodejs-mobile
          NODE_H="$(find /tmp/nodejs-mobile -path '*/include/node/node.h' | head -n1)"
          LIB_SO="$(find /tmp/nodejs-mobile -path '*/bin/arm64-v8a/libnode.so' | head -n1)"
          test -n "$NODE_H" || { echo "::error::node.h not found in archive"; exit 1; }
          test -n "$LIB_SO" || { echo "::error::arm64-v8a/libnode.so not found in archive"; exit 1; }
          INCLUDE_DIR="$(dirname "$(dirname "$NODE_H")")"
          BIN_DIR="$(dirname "$(dirname "$LIB_SO")")"
          echo "headers: $INCLUDE_DIR"
          echo "binaries: $BIN_DIR"
          rm -rf android/app/libnode
          mkdir -p android/app/libnode
          cp -R "$INCLUDE_DIR" android/app/libnode/include
          cp -R "$BIN_DIR" android/app/libnode/bin
          rm -rf android/app/libnode/bin/armeabi-v7a android/app/libnode/bin/x86 android/app/libnode/bin/x86_64
          ls -la android/app/libnode/bin/arm64-v8a

      - name: Build Node assets (server bundle + public + main.js)
        working-directory: tools/android
        run: |
          set -euo pipefail
          npm install --no-save esbuild@0.28.2 iconv-lite@0.7.3
          node build-node-assets.mjs

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::secret ANDROID_KEYSTORE_BASE64 is not configured"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/chima-release.jks"
          ls -l "$RUNNER_TEMP/chima-release.jks"

      - name: Assemble signed release APK
        env:
          CHIMA_KEYSTORE: ${{ runner.temp }}/chima-release.jks
          CHIMA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CHIMA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CHIMA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle -p android :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -n1)"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || { echo "::error::release APK missing"; exit 1; }
          ls -l "$APK"
          echo "--- badging ---"
          "$BT/aapt" dump badging "$APK" | head -n 30
          echo "--- signature ---"
          "$BT/apksigner" verify --print-certs "$APK"
          echo "--- contents (key entries) ---"
          unzip -l "$APK" | grep -E 'libnode|native-lib|libc\+\+_shared|nodejs-project|classes.dex|META-INF/(CERT|.*\.RSA)' | head -n 40
          OUT="chima-trader-${APP_VERSION}-android-arm64.apk"
          cp "$APK" "$OUT"
          echo "--- artifact ---"
          ls -l "$OUT"
          sha256sum "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chima-trader-android-apk
          path: chima-trader-1.4.0-android-arm64.apk
          if-no-files-found: error
          retention-days: 30
